<rect x="0" y="0" width="960" height="300" rx="14" fill="#0b1e24"/>
<text x="480" y="30" fill="#7ff0f5" font-size="17" text-anchor="middle" font-weight="bold">RATISS-FOCAL — pipeline expérimental (sans neurones, numpy + ripser)</text>
